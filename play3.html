<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NWA · V4.5 Mobile</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05070b}
#controls{display:none;position:fixed;inset:0;z-index:20;pointer-events:none}
.b{position:absolute;pointer-events:auto;width:82px;height:82px;border-radius:25px;border:1px solid rgba(255,255,255,.22);background:rgba(5,10,18,.22);color:#fff;font:900 38px system-ui;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.14);touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;opacity:.38;transition:opacity .18s,transform .1s,background .18s,border-color .18s,box-shadow .18s}
.b.on,.b:active{transform:scale(.94);opacity:.8;background:rgba(90,205,255,.34)}
#l{left:max(34px,calc(env(safe-area-inset-left) + 18px))!important;right:auto!important;top:max(72px,calc(env(safe-area-inset-top) + 54px))!important;bottom:auto!important}
#r{right:max(34px,calc(env(safe-area-inset-right) + 18px))!important;left:auto!important;top:max(72px,calc(env(safe-area-inset-top) + 54px))!important;bottom:auto!important}
#rotate{display:none;position:fixed!important;inset:0!important;width:100vw;height:100dvh;min-height:100vh;z-index:40;pointer-events:auto;align-items:center;justify-content:center;padding:28px;background:radial-gradient(circle at 50% 35%,rgba(24,51,74,.98),rgba(5,9,16,.99) 72%);color:#fff;text-align:center;font-family:system-ui;transform:none!important}
#rotateCard{width:min(520px,92vw);padding:34px 24px;border-radius:28px;background:rgba(8,14,24,.96);border:2px solid rgba(170,225,255,.48);box-shadow:0 18px 60px rgba(0,0,0,.52),0 0 42px rgba(100,210,255,.14)}
#rotateIcon{display:block;font-size:72px;line-height:1;margin-bottom:18px}
#rotate strong{display:block;font-size:clamp(27px,8vw,42px);line-height:1.05}
#rotate span:last-child{display:block;margin-top:13px;color:#cceeff;font-size:clamp(16px,4.5vw,22px);font-weight:800}
#powerBadge{position:fixed;top:max(68px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-12px) scale(.94);z-index:31;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:rgba(8,12,20,.94);border:1px solid rgba(170,225,255,.45);box-shadow:0 10px 32px rgba(0,0,0,.35),0 0 24px rgba(100,210,255,.12);color:#fff;font:900 15px system-ui;letter-spacing:.02em;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#powerBadge.show{opacity:1;transform:translate(-50%,0) scale(1)}
#powerIcon{font-size:24px;line-height:1}
#powerName{white-space:nowrap}
@media(pointer:coarse){#controls{display:block}}
@media(orientation:portrait){#rotate{display:flex}#controls{display:none!important}}
</style>
</head>
<body>
<iframe id="game" title="NWA Le Caverne dei Mostri Sonori" allow="autoplay"></iframe>
<div id="controls">
<button class="b" id="l" aria-label="Sinistra">←</button>
<button class="b" id="r" aria-label="Destra">→</button>
</div>
<div id="rotate" role="status" aria-live="polite"><div id="rotateCard"><span id="rotateIcon">↻</span><strong>GIRA IL TELEFONO</strong><span>Il gioco inizia con lo schermo orizzontale</span></div></div>
<div id="powerBadge"><span id="powerIcon">⚡</span><span id="powerName">POTERE</span></div>
<script>
const frame=document.getElementById('game');
const controls=document.getElementById('controls');
const rotate=document.getElementById('rotate');
const badge=document.getElementById('powerBadge');
const badgeIcon=document.getElementById('powerIcon');
const badgeName=document.getElementById('powerName');
let badgeTimer=null;

function syncOrientation(){
  const portrait=window.innerHeight>window.innerWidth;
  rotate.style.setProperty('display',portrait?'flex':'none','important');
  if(portrait) controls.style.setProperty('display','none','important');
  else controls.style.removeProperty('display');
}
syncOrientation();
window.addEventListener('resize',syncOrientation,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(syncOrientation,100),{passive:true});

function showPowerBadge(text){
  const m=text.match(/POTERE:\s*([^\s]+)\s*([^!]+)!/i);
  badgeIcon.textContent=m?m[1]:'⚡';
  badgeName.textContent=m?m[2].trim():'POTERE ATTIVO';
  badge.classList.add('show');
  clearTimeout(badgeTimer);
  badgeTimer=setTimeout(()=>badge.classList.remove('show'),2200);
}

async function boot(){
  let s=await fetch('index.html?v=452',{cache:'no-store'}).then(r=>r.text());
  s=s.replace('r:7,life:4','r:22,life:4')
     .replace('r:12,life:5','r:30,life:5')
     .replace("ctx.lineWidth=p.source==='boss'?6:4","ctx.lineWidth=p.source==='boss'?10:8")
     .replace("ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke()",
              "ctx.save();ctx.shadowColor=m.shot;ctx.shadowBlur=p.source==='boss'?24:18;ctx.globalAlpha=.34;ctx.fillStyle=m.shot;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#ffffff';ctx.lineWidth=p.source==='boss'?5:4;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();ctx.strokeStyle=m.shot;ctx.lineWidth=p.source==='boss'?10:8;ctx.beginPath();ctx.arc(p.x,p.y,p.r+5,0,Math.PI*2);ctx.stroke();ctx.restore()")
     .replace("speed=state.power==='wind'?350:260","speed=state.power==='wind'?410:315")
     .split('player.vy=-555').join('player.vy=-700')
     .replace("let audioCtx=null;function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}","let audioCtx=null,audioUnlocked=false;function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();if(!audioUnlocked){const buffer=audioCtx.createBuffer(1,1,22050),source=audioCtx.createBufferSource();source.buffer=buffer;source.connect(audioCtx.destination);source.start(0);audioUnlocked=true;}}")
     .replace("g.gain.setValueAtTime(gain,audioCtx.currentTime)","g.gain.setValueAtTime(Math.min(1,gain*2.6),audioCtx.currentTime)")
     .replace('#touchGuide,#touchFeedback { display:block; }','#touchGuide,#touchFeedback { display:none!important; }')
     .replace('#toast.show { opacity:1; }','#toast.show { opacity:1; } #toast { top:max(62px,env(safe-area-inset-top));bottom:auto; }')
     .replace("let toastTimer;function showToast(msg,ms=1700){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),ms);}","let toastTimer;function showToast(msg,ms=1700){toast.textContent=msg;toast.classList.toggle('levelIntro',String(msg).startsWith('Livello '));toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.classList.remove('show');toast.classList.remove('levelIntro')},ms);}")
     .replace("const t=state.world.theme;showToast(`Livello ${n}: ${t.name} · profondità ${t.depth}`,2700);","const t=state.world.theme;window.__nwaShownLevels=window.__nwaShownLevels||new Set();if(!window.__nwaShownLevels.has(n)){window.__nwaShownLevels.add(n);showToast(`Livello ${n}: ${t.name} · profondità ${t.depth}`,2200);}");

  frame.srcdoc=s;
  frame.addEventListener('load',()=>{
    const d=frame.contentDocument;
    const toast=d&&d.getElementById('toast');
    if(!toast) return;
    const gestures=new Map();
    const onTouchDown=e=>{
      const overlay=d.getElementById('overlay');
      if(e.pointerType!=='touch'||!overlay?.classList.contains('hidden')) return;
      e.preventDefault();e.stopImmediatePropagation();
      try{frame.contentWindow.ensureAudio?.()}catch{}
      gestures.set(e.pointerId,{x:e.clientX,y:e.clientY,jumped:false});
    };
    const onTouchMove=e=>{
      const g=gestures.get(e.pointerId);
      if(!g) return;
      e.preventDefault();e.stopImmediatePropagation();
      const dx=e.clientX-g.x,dy=e.clientY-g.y;
      if(!g.jumped&&dy<-22&&Math.abs(dy)>Math.abs(dx)*.5){
        g.jumped=true;kd('ArrowUp');setTimeout(()=>ku('ArrowUp'),120);
      }
    };
    const onTouchEnd=e=>{
      const g=gestures.get(e.pointerId);
      if(!g) return;
      e.preventDefault();e.stopImmediatePropagation();
      const dx=e.clientX-g.x,dy=e.clientY-g.y;
      if(!g.jumped&&Math.hypot(dx,dy)<18){kd('Space');ku('Space')}
      gestures.delete(e.pointerId);
    };
    d.addEventListener('pointerdown',onTouchDown,{capture:true,passive:false});
    d.addEventListener('pointermove',onTouchMove,{capture:true,passive:false});
    d.addEventListener('pointerup',onTouchEnd,{capture:true,passive:false});
    d.addEventListener('pointercancel',e=>gestures.delete(e.pointerId),{capture:true});
    const overlay=d.getElementById('overlay');
    const blockNativeTouch=e=>{
      if(!overlay?.classList.contains('hidden')) return;
      e.preventDefault();e.stopImmediatePropagation();
    };
    ['touchstart','touchmove','touchend','touchcancel','gesturestart','gesturechange','gestureend','dblclick'].forEach(type=>d.addEventListener(type,blockNativeTouch,{capture:true,passive:false}));
    const obs=new MutationObserver(()=>{
      const txt=(toast.textContent||'').trim();
      if(txt.startsWith('POTERE:')){
        showPowerBadge(txt);
        toast.style.visibility='hidden';
      }else{
        toast.style.visibility='';
      }
    });
    obs.observe(toast,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['class']});
  },{once:true});
}
boot();

function win(){return frame.contentWindow}
function unlockAudio(){try{win()?.ensureAudio?.()}catch{}}
function kd(code){win()?.dispatchEvent(new KeyboardEvent('keydown',{code,bubbles:true,cancelable:true}))}
function ku(code){win()?.dispatchEvent(new KeyboardEvent('keyup',{code,bubbles:true,cancelable:true}))}
function bindHold(id,code){
  const b=document.getElementById(id);
  const down=e=>{e.preventDefault();e.stopPropagation();unlockAudio();kd(code);b.classList.add('on')};
  const up=e=>{e.preventDefault();e.stopPropagation();ku(code);b.classList.remove('on')};
  b.addEventListener('pointerdown',down,{passive:false});
  ['pointerup','pointercancel','pointerleave'].forEach(x=>b.addEventListener(x,up,{passive:false}));
  ['contextmenu','selectstart','dragstart'].forEach(x=>b.addEventListener(x,e=>e.preventDefault()));
}
bindHold('l','ArrowLeft');
bindHold('r','ArrowRight');
</script>
</body>
</html>
