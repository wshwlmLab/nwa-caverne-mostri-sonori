const usedRiddles=new Set();
let generatedRiddleSerial=0;
function shuffledChoices(answer,wrongs){
 const vals=[String(answer),...wrongs.map(String)].filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);
 while(vals.length<3)vals.push(String(Number(answer)+vals.length+2));
 for(let i=vals.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vals[i],vals[j]]=[vals[j],vals[i]];}
 return {a:vals,ok:vals.indexOf(String(answer))};
}
function generatedRiddle(level){
 for(let tries=0;tries<200;tries++){
  generatedRiddleSerial++;
  let q,answer,wrongs;
  if(level<=1){const a=10+Math.floor(Math.random()*30),b=3+Math.floor(Math.random()*18);answer=a+b;q=`Quanto fa ${a} + ${b}?`;wrongs=[answer-1,answer+2];}
  else if(level===2){const a=2+Math.floor(Math.random()*9),b=2+Math.floor(Math.random()*9);answer=a*b;q=`Quanto fa ${a} × ${b}?`;wrongs=[answer-a,answer+b];}
  else if(level===3){const b=2+Math.floor(Math.random()*10),answer=3+Math.floor(Math.random()*10),a=b*answer;q=`Quanto fa ${a} ÷ ${b}?`;wrongs=[answer-1,answer+2];}
  else if(level===4){const den=[2,3,4,5][Math.floor(Math.random()*4)],num=1+Math.floor(Math.random()*(den-1)),unit=2+Math.floor(Math.random()*8),whole=den*unit;answer=num*unit;q=`Quanto fa ${num}/${den} di ${whole}?`;wrongs=[answer+unit,Math.max(1,answer-unit)];}
  else if(level===5){const a=4+Math.floor(Math.random()*9),b=3+Math.floor(Math.random()*8);answer=a*b;q=`Un rettangolo misura ${a} × ${b}. Qual è l’area?`;wrongs=[2*(a+b),answer+a];}
  else if(level===6){const a=(20+Math.floor(Math.random()*100))/10,b=(10+Math.floor(Math.random()*70))/10;answer=(a+b).toFixed(1).replace('.',',');q=`Quanto fa ${String(a).replace('.',',')} + ${String(b).replace('.',',')}?`;const n=Number(answer.replace(',','.'));wrongs=[(n+1).toFixed(1).replace('.',','),(n-.5).toFixed(1).replace('.',',')];}
  else if(level===7){const pct=[10,20,25,50][Math.floor(Math.random()*4)],base=(2+Math.floor(Math.random()*18))*20;answer=base*pct/100;q=`Quanto fa il ${pct}% di ${base}?`;wrongs=[answer+10,Math.max(1,answer-10)];}
  else if(level===8){const a=8+Math.floor(Math.random()*20),b=2+Math.floor(Math.random()*8),c=2+Math.floor(Math.random()*6);answer=(a+b)*c;q=`Quanto fa (${a} + ${b}) × ${c}?`;wrongs=[a+b*c,answer-c];}
  else if(level===9){const unit=2+Math.floor(Math.random()*8),qty1=3+Math.floor(Math.random()*5),qty2=qty1+2+Math.floor(Math.random()*5),cost=unit*qty1;answer=unit*qty2;q=`Se ${qty1} oggetti costano ${cost} €, quanto costano ${qty2} oggetti allo stesso prezzo?`;wrongs=[answer-unit,answer+unit];}
  else {const a=4+Math.floor(Math.random()*8),b=3+Math.floor(Math.random()*7),c=2+Math.floor(Math.random()*6),d=2+Math.floor(Math.random()*5);answer=(a*b+c)*d;q=`Quanto fa (${a} × ${b} + ${c}) × ${d}?`;wrongs=[a*b+c*d,answer-d];}
  const key='gen:'+q;if(usedRiddles.has(key))continue;const ch=shuffledChoices(answer,wrongs);usedRiddles.add(key);return {q,a:ch.a,ok:ch.ok,key,difficulty:level};
 }
 const n=++generatedRiddleSerial,answer=level*10+n,q=`Codice NWA ${level}-${n}: quanto fa ${answer} + ${level}?`;const ch=shuffledChoices(answer+level,[answer,answer+level+2]);const key='fallback:'+n;usedRiddles.add(key);return {q,a:ch.a,ok:ch.ok,key,difficulty:level};
}
function pickRiddle(level=state.level||1){

}

let audioCtx=null;function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}

 if(t.detail==='stalactite'){for(let i=0;i<19;i++){const x=((i*93-shift)%1450+1450)%1450-80,h=70+(i*41)%150;ctx.fillStyle=i%2?'rgba(88,103,112,.45)':'rgba(54,69,79,.48)';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+26,h);ctx.lineTo(x+58,0);ctx.fill()}}
 if(t.detail==='water'){ctx.fillStyle='rgba(50,190,220,.15)';ctx.fillRect(0,440,W,130);for(let i=0;i<14;i++){ctx.strokeStyle='rgba(110,235,255,.22)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(((i*130-shift*.4)%1450+1450)%1450,500+(i%3)*20,35,0,Math.PI);ctx.stroke()}for(let i=0;i<12;i++){ctx.fillStyle='rgba(105,240,190,.24)';ctx.beginPath();ctx.arc((i*123)%1280,410+(i%4)*25,5+(i%3)*2,0,6.3);ctx.fill()}}
 if(t.detail==='mine'){ctx.strokeStyle='rgba(170,120,65,.35)';ctx.lineWidth=12;for(let i=0;i<8;i++){const x=((i*220-shift)%1600+1600)%1600-120;ctx.strokeRect(x,90,130,470)}ctx.strokeStyle='rgba(245,185,90,.22)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,150);ctx.lineTo(W,150);ctx.stroke();for(let i=0;i<8;i++){ctx.fillStyle='rgba(255,190,80,.35)';ctx.beginPath();ctx.arc(i*180+80,150,10,0,6.3);ctx.fill()}}
 if(t.detail==='crystal'){for(let i=0;i<14;i++){const x=((i*120-shift)%1500+1500)%1500-100,y=140+(i%5)*75,s=30+(i%4)*12;ctx.fillStyle=i%2?'rgba(160,150,255,.24)':'rgba(105,220,255,.20)';ctx.beginPath();ctx.moveTo(x,y+s);ctx.lineTo(x+s*.45,y-s);ctx.lineTo(x+s,y+s);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(210,220,255,.32)';ctx.stroke()}}
 if(t.detail==='lava'){for(let i=0;i<11;i++){const x=((i*145-shift)%1500+1500)%1500-100;ctx.strokeStyle='rgba(255,85,25,.42)';ctx.lineWidth=8+(i%3)*3;ctx.beginPath();ctx.moveTo(x,0);ctx.bezierCurveTo(x+35,140,x-25,280,x+45,480);ctx.stroke()}ctx.fillStyle='rgba(255,100,20,.12)';ctx.fillRect(0,470,W,120)}
 if(t.detail==='mantle'){for(let i=0;i<18;i++){ctx.strokeStyle=`rgba(255,${60+(i%3)*25},20,.${18+(i%4)*5})`;ctx.lineWidth=5+(i%4);ctx.beginPath();ctx.moveTo((i*81-shift*.3)%1400,0);ctx.bezierCurveTo((i*91)%1280,170,(i*137)%1280,390,(i*169)%1280,610);ctx.stroke()}for(let i=0;i<24;i++){ctx.fillStyle='rgba(255,120,30,.2)';ctx.beginPath();ctx.arc((i*107)%1280,(i*79)%570,5+(i%4)*2,0,6.3);ctx.fill()}}
 if(t.detail==='core'){const rg=ctx.createRadialGradient(W/2,H/2,30,W/2,H/2,420);rg.addColorStop(0,'rgba(255,245,180,.8)');rg.addColorStop(.25,'rgba(255,120,20,.5)');rg.addColorStop(.62,'rgba(180,30,0,.23)');rg.addColorStop(1,'rgba(20,0,0,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);for(let r=100;r<520;r+=70){ctx.strokeStyle=`rgba(255,${120-r/6},40,.18)`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(W/2,H/2,r,0,6.3);ctx.stroke()}}
 if(arena){ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.07)';ctx.font='900 84px sans-serif';ctx.textAlign='center';ctx.fillText('ARENA NWA',W/2,180)}ctx.restore()}
function cloud(x,y,s,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,s*.42,0,6.3);ctx.arc(x+s*.45,y-s*.16,s*.5,0,6.3);ctx.arc(x+s*.95,y,s*.38,0,6.3);ctx.fill()}
function drawArenaWalls(t){ctx.fillStyle=t.rock;ctx.fillRect(0,180,34,430);ctx.fillRect(1246,180,34,430);ctx.strokeStyle=t.accent;ctx.lineWidth=4;ctx.strokeRect(15,195,16,390);ctx.strokeRect(1249,195,16,390)}
function drawArenaDoor(x,y,t){ctx.fillStyle=t.rock;roundRect(x,y,112,185,12,true);ctx.strokeStyle=t.accent;ctx.lineWidth=5;ctx.strokeRect(x,y,112,185);ctx.fillStyle='#fff';ctx.font='900 20px sans-serif';ctx.textAlign='center';ctx.fillText('ARENA',x+56,y+82);ctx.font='700 12px sans-serif';ctx.fillText('ENTRA',x+56,y+108)}
function drawPlayer(){const x=player.x,y=player.y;ctx.save();ctx.translate(x+player.w/2,y+player.h/2);ctx.scale(player.dir,1);ctx.fillStyle=state.invuln>0&&Math.floor(state.invuln*12)%2===0?'rgba(255,255,255,.4)':'#d6b27d';ctx.beginPath();ctx.arc(0,-17,12,0,6.3);ctx.fill();ctx.fillStyle='#c9a35f';ctx.fillRect(-17,-30,34,7);ctx.fillRect(-10,-38,22,9);ctx.fillStyle='#46596e';roundRect(-15,-6,30,34,6,true);ctx.fillStyle='#6c4b2b';ctx.fillRect(-18,2,7,20);ctx.fillRect(11,2,7,20);ctx.fillStyle='#cfd6df';ctx.fillRect(10,-2,22,7);ctx.fillStyle='#85dcff';ctx.beginPath();ctx.arc(34,1,5,0,6.3);ctx.fill();ctx.restore()}
function drawPowerOrb(o){const y=o.y+Math.sin(o.bob)*9,p=POWERS[o.type];ctx.save();ctx.translate(o.x,y);ctx.strokeStyle=p.color;ctx.lineWidth=5;for(let r=22;r<=38;r+=8){ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(0,0,r,0,6.3);ctx.stroke()}ctx.globalAlpha=1;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(0,0,15,0,6.3);ctx.fill();ctx.fillStyle='#071018';ctx.font='900 16px sans-serif';ctx.textAlign='center';ctx.fillText(p.letter,0,6);ctx.restore()}
function drawMonster(e){const m=MONSTERS[e.type];ctx.save();ctx.translate(e.x+e.w/2,e.y+e.h/2+Math.sin(e.phase)*3);ctx.fillStyle=m.body;
 if(e.type==='nimbus'){cloud(-24,-2,38,m.body);ctx.fillStyle=m.eye;ctx.beginPath();ctx.arc(-7,2,4,0,6.3);ctx.arc(9,2,4,0,6.3);ctx.fill();ctx.strokeStyle=m.shot;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-3,17);ctx.lineTo(-12,28);ctx.lineTo(2,25);ctx.lineTo(-4,37);ctx.stroke()}
 else if(e.type==='scarab'){ctx.beginPath();ctx.ellipse(0,0,25,18,0,0,6.3);ctx.fill();ctx.strokeStyle=m.eye;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-8,-18);ctx.lineTo(-22,-30);ctx.moveTo(8,-18);ctx.lineTo(22,-30);ctx.stroke();ctx.fillStyle=m.eye;ctx.beginPath();ctx.arc(-7,-4,4,0,6.3);ctx.arc(7,-4,4,0,6.3);ctx.fill()}
 else if(e.type==='rocker'){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?22:29;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.fillStyle=m.eye;ctx.fillRect(-13,-5,8,7);ctx.fillRect(5,-5,8,7)}
 else if(e.type==='bat'){ctx.beginPath();ctx.moveTo(0,6);ctx.lineTo(-31,-16);ctx.lineTo(-22,9);ctx.lineTo(-38,18);ctx.lineTo(-8,20);ctx.lineTo(0,28);ctx.lineTo(8,20);ctx.lineTo(38,18);ctx.lineTo(22,9);ctx.lineTo(31,-16);ctx.closePath();ctx.fill();ctx.fillStyle=m.eye;ctx.beginPath();ctx.arc(-6,5,4,0,6.3);ctx.arc(6,5,4,0,6.3);ctx.fill()}
 else if(e.type==='slime'){ctx.beginPath();ctx.arc(0,5,25,Math.PI,0);ctx.lineTo(25,18);ctx.quadraticCurveTo(13,11,4,20);ctx.quadraticCurveTo(-8,10,-25,18);ctx.closePath();ctx.fill();ctx.fillStyle=m.eye;ctx.beginPath();ctx.arc(-8,2,4,0,6.3);ctx.arc(8,2,4,0,6.3);ctx.fill()}
 else if(e.type==='crawler'){for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(i*11,0,12,0,6.3);ctx.fill()}ctx.strokeStyle=m.eye;ctx.lineWidth=3;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*11,9);ctx.lineTo(i*11-8,20);ctx.stroke()}ctx.fillStyle=m.eye;ctx.beginPath();ctx.arc(-17,-3,3,0,6.3);ctx.fill()}
 else if(e.type==='crystal'){ctx.beginPath();ctx.moveTo(0,-31);ctx.lineTo(24,12);ctx.lineTo(8,28);ctx.lineTo(-24,12);ctx.closePath();ctx.fill();ctx.strokeStyle=m.eye;ctx.stroke();ctx.fillStyle=m.eye;ctx.beginPath();ctx.arc(-6,6,3,0,6.3);ctx.arc(6,6,3,0,6.3);ctx.fill()}
 else {ctx.beginPath();for(let i=0;i<12;i++){const a=i*Math.PI/6,r=i%2?21:30;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.fillStyle=m.eye;ctx.beginPath();ctx.arc(-8,-3,5,0,6.3);ctx.arc(8,-3,5,0,6.3);ctx.fill()}
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-22,-35,44,5);ctx.fillStyle=m.shot;ctx.fillRect(-22,-35,44*(e.hp/e.maxHp),5);ctx.restore()}
function drawBoss(b){const m=MONSTERS[b.type];ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h/2);ctx.scale(2.0,2.0);const fake={...b,x:-24,y:-23,w:48,h:46,phase:b.phase};drawMonsterLocal(fake,m);ctx.restore()}
function drawMonsterLocal(e,m){ctx.fillStyle=m.body;ctx.beginPath();for(let i=0;i<14;i++){const a=i*Math.PI/7,r=i%2?20:31;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.fillStyle=m.eye;ctx.beginPath();ctx.arc(-8,-5,5,0,6.3);ctx.arc(8,-5,5,0,6.3);ctx.fill();ctx.strokeStyle=m.shot;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,38+Math.sin(e.phase*3)*3,0,6.3);ctx.stroke()}
function roundRect(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill)ctx.fill()}
function frame(t){const dt=Math.min(.033,(t-state.lastTime)/1000||0);state.lastTime=t;update(dt);draw();requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.code==='Space')shoot()});window.addEventListener('keyup',e=>keys.delete(e.code));document.addEventListener('visibilitychange',()=>{if(document.hidden){clearMoveKeys();touchState.clear();movePointer=null}});showTitle();requestAnimationFrame(frame);
})();
</script>
